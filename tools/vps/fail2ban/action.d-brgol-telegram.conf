# /etc/fail2ban/action.d/brgol-telegram.conf — aviso no Telegram a cada ban (tools/vps/fail2ban/brgol-f2b-aviso.sh).
# 22/09/2026: a versão de 15/09 tinha o token e o chat vazios (variáveis expandidas na hora de escrever o arquivo)
# e nunca mandou nada — agora o script lê /etc/brgol-telegram.conf na hora.
[Definition]
actionstart =
actionstop =
actioncheck =
actionban = /usr/local/bin/brgol-f2b-aviso.sh "<ip>" "<name>" "<failures>" "<bantime>"
actionunban =
