name: Deploy → VPS (brgol.managol.com.br)

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Deploy na VPS
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Executa o script de deploy na VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: 187.127.17.121
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 18m
          script: bash /usr/local/bin/brgol-deploy.sh
