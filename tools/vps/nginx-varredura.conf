    # 22/09/2026 — varredura de arquivos (/.env, /.git/config, /dump.sql, /jwt.key, /package.json…): 404 seco em vez
    # do index.html do SPA (o robô via "200" e achava que tinha encontrado algo). Só na RAIZ e só dotfiles, para não
    # pegar /tv/, /assets/, /escudos/ nem /.well-known/ (certbot). O fail2ban conta isso na jaula brgol-probes.
    location ~* ^/(\.(?!well-known/)|[^/]+\.(env|sql|zip|tar|gz|rar|7z|bak|old|orig|log|key|pem|db|sqlite|yml|yaml|ini|sh|php|asp|aspx|jsp)$|(package(-lock)?\.json|dockerfile|docker-compose\.yml|ecosystem\.config\.js|vercel\.json|composer\.json|web\.config)$) { return 404; }
