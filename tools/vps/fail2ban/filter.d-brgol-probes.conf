# /etc/fail2ban/filter.d/brgol-probes.conf — varredura de arquivos e endereços sensíveis no nginx (access.log).
# 22/09/2026, depois da varredura de 17/09 (IP 107.150.41.226: /.env, /.git/config, /dump.sql, /jwt.key, /package.json,
# /api/swagger.json…). O status não importa (o SPA respondia 200 com o index.html; agora o nginx dá 404 — ver o
# location de "varredura" em sites-available/brgol). /.well-known/ (certbot, security.txt) fica de fora.
[Definition]
failregex = ^<HOST> - \S+ \[\] "(GET|POST|HEAD|OPTIONS) /(\.(?!well-known/)[^ "]*|[^/ "]+\.(env|sql|zip|tar|gz|rar|7z|bak|old|orig|log|key|pem|db|sqlite|yml|yaml|ini|sh|php|asp|aspx|jsp)|(package(-lock)?\.json|dockerfile|docker-compose\.yml|ecosystem\.config\.js|vercel\.json|composer\.json|web\.config)|(phpmyadmin|pma|wp-admin|wp-login\.php|xmlrpc\.php|cgi-bin)[^ "]*|api/(swagger|openapi|graphql|debug|metrics|actuator|\.env)[^ "]*)( |\?)[^"]*" \d+ 
ignoreregex =
