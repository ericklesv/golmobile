# /etc/fail2ban/jail.d/brgol.conf — JogaGol (docs/SEGURANCA.md, bloco 4). Todo ban avisa no Telegram
# (action.d/brgol-telegram.conf → /usr/local/bin/brgol-f2b-aviso.sh, que explica a jaula em português).
[DEFAULT]
bantime = 600
findtime = 60
action = %(action_)s
         brgol-telegram
[sshd]
enabled = true
maxretry = 5
bantime = 3600
# backend = auto: o padrão do Ubuntu é "systemd" (lê o journal) e o nginx grava acesso/erro em ARQUIVO — sem isso as
# jaulas do nginx nunca viam nada (descoberto em 22/09/2026, 1 semana depois de ligar)
[nginx-limit-req]
enabled = true
backend = auto
logpath = /var/log/nginx/error.log
maxretry = 30
[nginx-botsearch]
enabled = true
backend = auto
logpath = /var/log/nginx/access.log
maxretry = 10
# 22/09/2026 — varredura de arquivos sensíveis (filter.d/brgol-probes.conf): 4 em 5 min = 1 h fora
[brgol-probes]
enabled = true
backend = auto
logpath = /var/log/nginx/access.log
maxretry = 4
findtime = 300
bantime = 3600
