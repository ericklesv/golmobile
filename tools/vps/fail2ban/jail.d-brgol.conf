# /etc/fail2ban/jail.d/brgol.conf — JogaGol (docs/SEGURANCA.md, bloco 4). Todo ban avisa no Telegram
# (action.d/brgol-telegram.conf → /usr/local/bin/brgol-f2b-aviso.sh, que explica a jaula em português).
[DEFAULT]
bantime = 600
findtime = 60
action = %(action_)s
         brgol-telegram
# NUNCA bloquear quem é admin do JogaGol (dono, 22/09/2026: "vai banir o admin? espero que não"): o script pergunta
# ao banco se o IP é de uma conta com isAdmin (o IP de casa muda, lista fixa não serve). Banco fora = bloqueia normal.
ignorecommand = /usr/local/bin/brgol-admin-ip.sh <ip>
# a própria VPS (curl de teste saindo pelo IP público) e localhost
ignoreip = 127.0.0.1/8 ::1 187.127.17.121
[sshd]
enabled = true
maxretry = 5
bantime = 3600
# backend = auto: o padrão do Ubuntu é "systemd" (lê o journal) e o nginx grava acesso/erro em ARQUIVO — sem isso as
# jaulas do nginx nunca viam nada (descoberto em 22/09/2026, 1 semana depois de ligar)
[nginx-limit-req]
enabled = true
backend = auto
port = http,https
logpath = /var/log/nginx/error.log
maxretry = 30
[nginx-botsearch]
enabled = true
backend = auto
port = http,https
logpath = /var/log/nginx/access.log
maxretry = 10
# 22/09/2026 — varredura de arquivos sensíveis (filter.d/brgol-probes.conf): 4 em 5 min = 1 h fora
# port = http,https é obrigatório: sem isso o padrão do fail2ban é 0:65535 e o bloqueio derruba TAMBÉM O SSH —
# foi o que aconteceu em 22/09/2026 (o Guilherme se bloqueou testando e perdeu o servidor por 1 h).
[brgol-probes]
enabled = true
backend = auto
port = http,https
logpath = /var/log/nginx/access.log
maxretry = 4
findtime = 300
bantime = 3600
