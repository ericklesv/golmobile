# /etc/nginx/sites-available/brgol  →  brgol.managol.com.br
# Front estático (web/dist) + proxy da API (PM2 brgol-api na porta 4310).
# O certbot adiciona o bloco HTTPS automaticamente (certbot --nginx -d brgol.managol.com.br).

server {
    listen 80;
    listen [::]:80;
    server_name brgol.managol.com.br;

    root /var/www/brgol/app/web/dist;
    index index.html;

    client_max_body_size 8m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # WebSocket do Cabeção (head soccer 1x1 ao vivo)
    location /api/ws/ {
        proxy_pass http://127.0.0.1:4310;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:4310;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # assets com hash: cache longo
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /sw.js { add_header Cache-Control "no-cache"; }
    location = /manifest.webmanifest { add_header Cache-Control "no-cache"; }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
